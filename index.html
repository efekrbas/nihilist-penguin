<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Nihilist Penguin is a quick-to-play Antarctic endless runner. Jump over ice and gaps, and chase your personal best.">
    <meta name="theme-color" content="#0a0a1a">
    <title>Nihilist Penguin 🐧</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="game-container">
        <!-- Main Menu -->
        <div id="menu-screen" class="screen active">
            <div class="stars"></div>
            <div class="menu-content">
                <div class="title-container">
                    <h1 class="game-title">NIHILIST<br>PENGUIN</h1>
                    <div class="penguin-preview">🐧</div>
                </div>
                <p class="tagline" data-i18n="tagline">"Nothing has meaning... but we keep walking anyway."</p>
                <button id="start-btn" class="game-btn pulse">
                    <span data-i18n="start">START</span>
                </button>
                <div class="instructions">
                    <p data-i18n="mobileInstr">📱 Mobile: Tap the screen</p>
                    <p data-i18n="desktopInstr">💻 Desktop: Space or ↑</p>
                </div>
            </div>
            <div class="snow-overlay"></div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div id="game-ui">
                <div class="ui-row">
                    <div class="score-display">
                        <span class="label" data-i18n="distance">DISTANCE</span>
                        <span id="distance" class="value">0m</span>
                    </div>
                    <div class="high-score-display">
                        <span class="label" data-i18n="best">BEST</span>
                        <span id="high-score" class="value">0m</span>
                    </div>
                </div>
                <div id="quote-display" class="quote"></div>
            </div>
            <canvas id="game-canvas"></canvas>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen">
            <div class="gameover-content">
                <h2 class="gameover-title" data-i18n="journeyEnd">JOURNEY ENDED</h2>
                <div class="final-stats">
                    <div class="stat">
                        <span class="stat-label" data-i18n="thisTime">This time</span>
                        <span id="final-distance" class="stat-value">0m</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label" data-i18n="farthest">Farthest</span>
                        <span id="final-high-score" class="stat-value">0m</span>
                    </div>
                </div>
                <p id="final-quote" class="final-quote"></p>
                <button id="restart-btn" class="game-btn">
                    <span data-i18n="tryAgain">TRY AGAIN</span>
                </button>
                <button id="menu-btn" class="game-btn secondary">
                    <span data-i18n="mainMenu">MAIN MENU</span>
                </button>
            </div>
        </div>
    </div>

    <script src="quotes.js"></script>
    <script src="game.js"></script>
</body>

</html>
